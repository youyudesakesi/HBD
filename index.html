<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>邱泓瑜 生日快乐</title>
<script src="confetti.browser.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;overflow:hidden;font-family:'Georgia','STKaiti','KaiTi',serif;background:#000;user-select:none;-webkit-user-select:none;}
.shelf-game-area {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    align-items: center;
    padding: 40px 20px 20px;
    box-sizing: border-box;
}

.mango-shelf-row {
    display: flex;
    gap: 25px;
    justify-content: center;
    align-items: center;
    margin-top: 20px;
}

.mango-item {
    width: 65px;
    height: 65px;
    background: url('dasucai.png') no-repeat;
    background-size: 420px auto;
    cursor: pointer;
    transition: transform 0.2s;
    filter: drop-shadow(0 4px 6px rgba(0,0,0,0.4));
}
.mango-item:hover { transform: scale(1.15); }

.m-green { background-position: -105px -10px; }
.m-rotten { background-position: -155px -10px; }
.m-yellow { background-position: -20px -70px; }

.basket-shelf-row {
    margin-bottom: 25px;
}
.basket-item {
    position: absolute; 
    z-index: 50; /* 确保在货架背景之上 */
    bottom: 20px; /* 控制它落在最底层货架的木板上，可根据视觉效果微调 */
    left: 50%;
    transform: translateX(-50%); /* 确保它在正中间 */
    width: 90px; /* 篮子的宽度，可以按需改动 */
    height: auto;
    filter: drop-shadow(0 6px 10px rgba(0,0,0,0.5)); /* 保留你原本好看的阴影效果 */
}

@keyframes shake {
    0%, 100% { transform: translateX(0); }
    20%, 60% { transform: translateX(-8px); }
    40%, 80% { transform: translateX(8px); }
}
.shake-anim { animation: shake 0.4s ease; }

/* === 自定义光标 === */
#cursor-dot{position:fixed;width:16px;height:16px;border-radius:50%;pointer-events:none;z-index:10000;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(255,230,180,0.9) 0%,rgba(255,200,100,0.3) 50%,transparent 100%);mix-blend-mode:screen;transition:width .15s,height .15s;}
#fx-canvas{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:9998;}

/* === 阶段系统 === */
.stage{position:fixed;top:0;left:0;width:100vw;height:100vh;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;z-index:1;transition:opacity 1s ease;}
.stage.active{opacity:1;pointer-events:auto;z-index:10;}
#blackout{position:fixed;top:0;left:0;width:100vw;height:100vh;background:#000;z-index:5000;opacity:0;pointer-events:none;transition:opacity 1.2s ease;}
#blackout.show{opacity:1;pointer-events:auto;}

/* === 音乐按钮 === */
#music-btn{position:fixed;top:18px;right:18px;width:36px;height:36px;background:rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.15);border-radius:50%;cursor:pointer;z-index:10001;display:flex;align-items:center;justify-content:center;transition:all .3s;backdrop-filter:blur(5px);}
#music-btn:hover{background:rgba(255,215,0,.1);border-color:rgba(255,215,0,.3);}
#music-btn svg{width:18px;height:18px;fill:rgba(255,255,255,.5);transition:fill .3s;}
#music-btn.on svg{fill:#FFD700;animation:pulse 2s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}

/* === 音频解锁 === */
#unlock{position:fixed;top:0;left:0;width:100vw;height:100vh;background:#000;z-index:10002;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:opacity .8s;}
#unlock.hide{opacity:0;pointer-events:none;}
#unlock h1{color:rgba(255,255,255,.6);font-size:20px;letter-spacing:4px;animation:breathe 2s ease-in-out infinite;}
#unlock p{color:rgba(255,255,255,.3);font-size:13px;margin-top:12px;letter-spacing:2px;}
@keyframes breathe{0%,100%{opacity:.3;transform:scale(1)}50%{opacity:.7;transform:scale(1.03)}}

/* ========== 阶段一：烟花 ========== */
#s-fireworks{background:radial-gradient(ellipse at center,#0a0a1a 0%,#000 80%);}
#fw-canvas{position:absolute;top:0;left:0;width:100%;height:100%;}
.fw-hint{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:rgba(255,255,255,.3);font-size:18px;letter-spacing:4px;animation:breathe 2s ease-in-out infinite;z-index:2;text-shadow:0 0 20px rgba(255,255,255,.15);}
.bday-text{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:clamp(36px,8vw,72px);font-weight:bold;letter-spacing:6px;text-align:center;opacity:0;z-index:5;background:linear-gradient(135deg,#FFD700,#FF6B6B,#FFD700,#4ECDC4,#FFD700);background-size:300% 300%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 0 30px rgba(255,215,0,.5));animation:gradShift 3s ease infinite;}
.bday-text.show{animation:textIn 1.5s ease forwards,gradShift 3s ease infinite 1.5s;}
@keyframes textIn{0%{opacity:0;transform:translate(-50%,-50%) scale(.3);filter:blur(20px) drop-shadow(0 0 30px rgba(255,215,0,.5))}100%{opacity:1;transform:translate(-50%,-50%) scale(1);filter:blur(0) drop-shadow(0 0 30px rgba(255,215,0,.5))}}
@keyframes gradShift{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.fw-counter{position:absolute;bottom:30px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,.2);font-size:13px;z-index:2;}

/* ========== 阶段二：拼图 ========== */
#s-puzzle{background:#1a1a2e;background-image:repeating-linear-gradient(45deg,rgba(60,40,80,.03) 0px,rgba(60,40,80,.03) 2px,transparent 2px,transparent 40px),repeating-linear-gradient(-45deg,rgba(80,40,60,.03) 0px,rgba(80,40,60,.03) 2px,transparent 2px,transparent 40px),radial-gradient(ellipse at center,#1a1528 0%,#0a0a12 80%);}
.pz-wrap{position:relative;display:flex;flex-direction:column;align-items:center;z-index:5;}
.pz-title{color:#c9b3a0;font-size:13px;letter-spacing:6px;margin-bottom:16px;text-transform:uppercase;opacity:.7;}
.pz-grid{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:2px;background:rgba(0,0,0,.6);padding:3px;border:2px solid #555;box-shadow:0 0 30px rgba(100,60,120,.3);width:300px;height:300px;position:relative;}
.pz-cell{width:100%;height:100%;background:#1a1a2e;cursor:pointer;position:relative;overflow:hidden;transition:box-shadow .3s;}
.pz-cell.movable:hover{box-shadow:inset 0 0 15px rgba(200,150,100,.3);}
.pz-cell.selected{box-shadow:inset 0 0 20px rgba(255,215,0,.7);outline:2px solid #FFD700;}
.pz-cell img{position:absolute;width:300px;height:300px;object-fit:initial;pointer-events:none;}
.pz-cell.empty{background:#cfd4dc;}
.pz-cell.empty img{display:none;}
.pz-cell.solved{animation:pzFlash .5s ease;}
@keyframes pzFlash{0%,100%{box-shadow:inset 0 0 0 rgba(255,255,255,0)}50%{box-shadow:inset 0 0 40px rgba(255,255,255,.9)}}
.pz-bubble{position:absolute;top:-55px;left:50%;transform:translateX(-50%) translateY(15px);background:rgba(30,25,40,.95);border:1px solid #c9b3a0;color:#e8d5c0;padding:10px 22px;border-radius:8px;font-size:15px;white-space:nowrap;opacity:0;transition:all .8s;z-index:10;box-shadow:0 4px 20px rgba(0,0,0,.5);}
.pz-bubble::after{content:'';position:absolute;bottom:-7px;left:50%;transform:translateX(-50%);border-left:7px solid transparent;border-right:7px solid transparent;border-top:7px solid #c9b3a0;}
.pz-bubble.show{opacity:1;transform:translateX(-50%) translateY(0);}
.seb-figure{position:absolute;right:5%;bottom:8%;display:flex;flex-direction:column;align-items:center;opacity:0;transform:translateX(80px);transition:all 1s;z-index:8;}
.seb-figure.show{opacity:1;transform:translateX(0);}
.seb-img{width: auto;
  max-height: 300px;
  object-fit: contain;
  border: none;
  box-shadow: none;
  filter: contrast(1.2);}
/* 2. 下方的英伦风对话框 */
.seb-dialog {
  margin-top: 12px;
  background: rgba(25, 20, 35, .95);
  border: 2px solid #8b7d6b;
  border-radius: 2px;
  padding: 14px 22px;
  color: #e8d5c0;
  font-style: italic;
  max-width: 260px;
  min-height: 44px;
  position: relative;
  box-shadow: 0 0 20px rgba(100, 80, 60, .2);
}

/* 对话框顶部的纹理装饰 */
.seb-dialog::before {
  content: '❦';
  position: absolute;
  top: -14px;
  left: 50%;
  transform: translateX(-50%);
  color: #8b7d6b;
  font-size: 13px;
}

/* 3. 打字机光标闪烁效果 */
.tw-cursor {
  display: inline-block;
  width: 2px;
  height: 1em;
  background: #e8d5c0;
  animation: blink .7s infinite;
  vertical-align: middle;
}

@keyframes blink {
  0%, 100% { opacity: 1; }
  50% { opacity: 0; }
}

/* ========== 阶段三：星星 ========== */
#s-stars{background:radial-gradient(ellipse at center,#0d1b3e 0%,#050818 60%,#000 100%);transition:background 2s;}
#s-stars.bright{background:radial-gradient(ellipse at center,#1a2b5e 0%,#0d1840 40%,#050818 100%);}
#stars-canvas{position:absolute;top:0;left:0;width:100%;height:100%;z-index:1;}
.star-bar-wrap{position:absolute;top:28px;left:50%;transform:translateX(-50%);width:280px;z-index:5;}
.star-bar{width:100%;height:4px;background:rgba(255,255,255,.1);border-radius:2px;overflow:hidden;}
.star-bar-fill{height:100%;width:0%;background:linear-gradient(90deg,#FFD700,#FFA500,#FFD700);border-radius:2px;transition:width .5s;box-shadow:0 0 12px rgba(255,215,0,.5);}
.star-bar-text{text-align:center;color:#FFD700;font-size:13px;margin-top:6px;letter-spacing:2px;}
.cstar{position:absolute;width:22px;height:22px;cursor:pointer;z-index:4;opacity:.7;transition:opacity .3s,transform .3s;}
.cstar::before{content:'★';font-size:22px;color:#FFD700;text-shadow:0 0 8px rgba(255,215,0,.7),0 0 18px rgba(255,215,0,.3);display:block;}
.cstar:hover{opacity:1;transform:scale(1.3);}
.cstar.twinkle{animation:stwinkle 2s ease-in-out infinite;}
@keyframes stwinkle{0%,100%{opacity:.4;transform:scale(1)}50%{opacity:.9;transform:scale(1.12)}}
.cstar.flying{pointer-events:none;transition:all .7s cubic-bezier(.5,-.5,.5,1.5);}
.msg-box{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;z-index:6;width:80%;max-width:650px;display:none;}
.msg-line{color:rgba(255,255,255,.9);opacity:0;margin-bottom:18px;line-height:1.8;transition:opacity 1.5s;text-shadow:0 0 20px rgba(255,255,255,.2);}
.msg-line.show{opacity:1;}
.msg-3{font-size:clamp(20px,4vw,26px)!important;font-weight:bold;letter-spacing:2px;background:linear-gradient(90deg,#FFD700,#FFA500,#FFD700);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}
.next-btn{margin-top:25px;padding:11px 32px;background:transparent;border:1px solid rgba(255,215,0,.5);color:#FFD700;font-size:15px;letter-spacing:3px;cursor:pointer;border-radius:2px;opacity:0;transition:all .8s;font-family:inherit;backdrop-filter:blur(5px);}
.next-btn.show{opacity:1;}
.next-btn:hover{background:rgba(255,215,0,.1);box-shadow:0 0 20px rgba(255,215,0,.3);letter-spacing:5px;}

/* ========== 阶段四：蛋糕制作 ========== */
#s-cake {
    background: linear-gradient(135deg, rgba(255,250,245,.03) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 80%, #3a3025 0%, #1a1510 40%, #0d0a08 100%);
}

.counter-bg {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 35%;
    background: linear-gradient(180deg, #2a2218 0%, #4a3a2e 15%, #5a4a3a 25%, #4a3a2e 35%, #2a2218 100%);
    z-index: 1;
}

.counter-bg::before {
    content: '';
    position: absolute;
    top: -2px;
    left: 0;
    width: 100%;
    height: 3px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,.08), transparent);
}

.step-dots {
    position: absolute;
    top: 28px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 18px;
    z-index: 5;
}

.sdot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: rgba(255,255,255,.15);
    transition: all .5s;
}

.sdot.active {
    background: #FFD700;
    box-shadow: 0 0 10px rgba(255,215,0,.5);
}

.sdot.done {
    background: #4ECDC4;
}

.cake-inst {
    position: absolute;
    top: 60px;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(255,235,200,.65);
    font-size: 15px;
    z-index: 5;
    text-align: center;
    letter-spacing: 1px;
    min-height: 22px;
    transition: opacity .5s;
}

/* ===== 主工作台外框 ===== */
.cake-ws {
    position: relative;
    width: 360px;
    height: 320px;
    border-radius: 16px;
    box-shadow: 0 12px 30px rgba(0,0,0,0.6);
    z-index: 3;
    overflow: hidden;
    background: #2a2218;
}

/* ------------------------------------------
   步骤 1 & 步骤 2：挑选与切芒果
   ------------------------------------------ */
#w-step-1, #shelf-container {
    width: 100%;
    height: 100%;
    position: relative;
    display: block;
}

#w-step-2 {
    width: 100%;
    height: 100%;
    position: absolute;
    top: 0;
    left: 0;
}

/* 货架背景图 */
.shelf-bg {
    width: 100% !important;
    height: 100% !important;
    object-fit: cover;
    display: block !important;
    position: absolute;
    top: 0;
    left: 0;
    z-index: 1;
}

/* 芒果元素 */
.mango-item {
    position: absolute;
    width: 38px !important;
    height: auto !important;
    cursor: grab;
    touch-action: none;
    z-index: 50;
    filter: drop-shadow(0 4px 6px rgba(0,0,0,0.4));
}

#mango-green { top: 142px; left: 108px; }
#mango-good  { top: 142px; left: 158px; }
#mango-bad   { top: 142px; left: 208px; }

.mango-item:active {
    cursor: grabbing;
    transform: scale(1.1);
}

/* ------------------------------------------
   步骤 3：打发奶油
   ------------------------------------------ */
#w-step-3 {
    display: none;
    width: 100%;
    height: 100%;                 /* 继承工作台 320px 高度 */
    position: relative;
    padding: 0;
    box-sizing: border-box;
}

#w-step-3[style*="display: flex"],
#w-step-3[style*="display: block"] {
    display: flex !important;
    justify-content: center;
    align-items: center;
}

/* 砧板背景容器：严格契合 360x320 的工作台尺寸 */
#w-step-3 .board-container {
    width: 100%;
    height: 100%;                 /* 填满外层卡片，不再产生多余黑框 */
    background-image: url('zhenban.jpg');
    background-size: cover;
    background-position: center;
    position: relative;
    margin: 0 auto;
    border-radius: 16px;
    overflow: hidden;
    user-select: none;
}

/* 奶油碗：落于砧板正中央 */
#cream-img {
    position: absolute;
    top: 52%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 150px;
    height: auto;
    user-select: none;
    -webkit-user-drag: none;
    pointer-events: auto;
    z-index: 2;
    transition: transform 0.1s ease;
}

/* 蛋抽：贴近右上角绿叶下方，与小刀视觉对齐 */
#whisk-tool {
    position: absolute;
    top:20x;
    right: 42px;
    width: 65px;
    height: auto;
    cursor: grab;
    user-select: none;
    -webkit-user-drag: none;
    z-index: 10;
}

/* 拖拽蛋抽时的状态 */
#whisk-tool.dragging {
    position: fixed;
    pointer-events: none;
    transform: translate(-50%, -50%) rotate(-15deg);
    cursor: grabbing;
    z-index: 9999;
}

/* 蛋糕组装 */
.cake-plate{width:240px;height:70px;position:relative;display:none;z-index:3;}
.cake-plate.show{display:block;animation:plateIn .8s ease;}
@keyframes plateIn{0%{opacity:0;transform:translateY(40px)}100%{opacity:1;transform:translateY(0)}}
.plate-base{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:220px;height:26px;background:linear-gradient(180deg,#ddd,#bbb 50%,#999);border-radius:50%;box-shadow:0 4px 12px rgba(0,0,0,.3);}
.cake-layer{position:absolute;left:50%;transform:translateX(-50%);opacity:0;transition:opacity .5s;}
.cake-layer.show{opacity:1;animation:popIn .5s ease;}
.cl-base{bottom:13px;width:150px;height:55px;background:linear-gradient(180deg,#f5e6d3,#e8d0b8 50%,#d4b896);border-radius:7px 7px 3px 3px;box-shadow:inset -4px -4px 8px rgba(120,80,40,.2);}
.cl-cream{bottom:58px;width:160px;height:22px;background:linear-gradient(180deg,#fff,#fffcf0 50%,#f5edd5);border-radius:50%;}
.cl-mango{bottom:72px;width:140px;height:26px;}
.cl-mango .mdice{width:22px;height:22px;}
.candle-slot{position:absolute;bottom:90px;left:50%;transform:translateX(-50%);z-index:5;opacity:0;transition:opacity .5s;}
.candle-slot.show{opacity:1;animation:popIn .5s ease;}
.candle-body{width:10px;height:35px;background:linear-gradient(180deg,#FFD700,#FFA500 50%,#CC8800);border-radius:2px;position:relative;}
.candle-num{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:9px;font-weight:bold;color:#333;}
.candle-wick{position:absolute;top:-4px;left:50%;transform:translateX(-50%);width:2px;height:7px;background:#333;}
.candle-flame{position:absolute;top:-18px;left:50%;transform:translateX(-50%);width:10px;height:15px;background:radial-gradient(ellipse at center,#fff 0%,#FFD700 30%,#FF6B00 70%,transparent 100%);border-radius:50% 50% 50% 50%/70% 70% 50% 50%;animation:flicker .15s infinite alternate;box-shadow:0 0 18px rgba(255,165,0,.5),0 0 35px rgba(255,100,0,.3);}
@keyframes flicker{0%{transform:translateX(-50%) scale(1) rotate(-2deg);height:15px}100%{transform:translateX(-50%) scale(1.08) rotate(2deg);height:17px}}

/* SVG写字 */
.write-svg{position:absolute;top:8px;left:50%;transform:translateX(-50%);z-index:6;pointer-events:none;display:none;}
.wpath{fill:none;stroke:#5C3A1E;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:800;stroke-dashoffset:800;}
.wpath.anim{animation:writeDash 2s ease forwards;}
@keyframes writeDash{to{stroke-dashoffset:0}}

/* 拖拽元素 */
.drag-area{position:absolute;bottom:50px;left:50%;transform:translateX(-50%);display:flex;gap:12px;z-index:5;display:none;}
.drag-item{padding:9px 18px;border:1px solid rgba(255,215,0,.4);background:rgba(30,25,15,.8);color:#FFD700;font-size:13px;letter-spacing:2px;cursor:grab;border-radius:4px;transition:all .3s;backdrop-filter:blur(5px);user-select:none;-webkit-user-select:none;}
.drag-item:hover{background:rgba(50,40,20,.9);box-shadow:0 0 12px rgba(255,215,0,.3);}
.drag-item.dragging{opacity:.5;cursor:grabbing;}
.drag-item.done{opacity:.3;pointer-events:none;border-color:#4ECDC4;color:#4ECDC4;}
.cake-prog{position:absolute;bottom:25px;left:50%;transform:translateX(-50%);color:rgba(255,235,200,.45);font-size:12px;z-index:5;}

/* ========== 阶段五：终章 ========== */
#s-finale{background:radial-gradient(ellipse at center,#0a0508 0%,#000 100%);}
.finale-beam{position:absolute;top:0;left:50%;transform:translateX(-50%);width:300px;height:100%;background:radial-gradient(ellipse at center top,rgba(255,240,200,.12) 0%,transparent 60%);z-index:1;display:none;animation:beamPulse 4s ease-in-out infinite;}
@keyframes beamPulse{0%,100%{opacity:.6;width:300px}50%{opacity:1;width:340px}}
.finale-display{position:relative;z-index:3;display:flex;flex-direction:column;align-items:center;}
.finale-cake{width:180px;height:120px;position:relative;filter:drop-shadow(0 0 25px rgba(255,200,100,.15));}
.fc-candles{position:absolute;bottom:110px;left:50%;transform:translateX(-50%);display:flex;gap:14px;z-index:4;}
.fc-candle{width:9px;height:40px;position:relative;}
.fc-cbody{width:100%;height:35px;background:linear-gradient(180deg,#FFD700,#FFA500 50%,#CC8800);border-radius:2px;}
.fc-flame{position:absolute;top:-16px;left:50%;transform:translateX(-50%);width:11px;height:18px;background:radial-gradient(ellipse at center,#fff 0%,#FFD700 30%,#FF6B00 60%,transparent 100%);border-radius:50% 50% 50% 50%/70% 70% 50% 50%;animation:flicker .12s infinite alternate;box-shadow:0 0 22px rgba(255,165,0,.5),0 0 45px rgba(255,100,0,.3),0 0 70px rgba(255,50,0,.15);}
.fc-flame.out{animation:flameOut .8s ease forwards;}

.fm-sub{color:rgba(255,215,0,.65);font-size:15px;margin-top:25px;letter-spacing:2px;}

</style>
</head>
<body>

<script>
/* ================================================================
   音频引擎 — 全部 Web Audio API 实时合成，零外部文件
   ================================================================ */
const Audio = {
  ctx: null, master: null, bgmGain: null, bgmOn: false, bgmTimer: null, bgmIdx: 0, ready: false,

  init() {
    if (this.ready) return;
    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
    this.master = this.ctx.createGain();
    this.master.gain.value = 0.7;
    this.master.connect(this.ctx.destination);
    this.bgmGain = this.ctx.createGain();
    this.bgmGain.gain.value = 0.12;
    this.bgmGain.connect(this.ctx.destination);
    this.ready = true;
  },

  resume() { if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume(); },

  tone(freq, dur, type='sine', vol=0.3, att=0.01) {
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(vol, t + att);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g); g.connect(this.master);
    o.start(t); o.stop(t + dur + 0.05);
  },

  noise(dur, hpFreq=2000, vol=0.15) {
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    const buf = this.ctx.createBuffer(1, this.ctx.sampleRate * dur, this.ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = (Math.random()*2-1) * Math.pow(1-i/d.length, 2);
    const src = this.ctx.createBufferSource(); src.buffer = buf;
    const flt = this.ctx.createBiquadFilter(); flt.type = 'highpass'; flt.frequency.value = hpFreq;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    src.connect(flt); flt.connect(g); g.connect(this.master);
    src.start(t);
  },

  // 修正后的烟花音效：高频清脆火花（无大鼓低音，纯净逼真）
  sfxFirework() {
    if (!this.ctx) return;
    this.noise(0.35, 1800, 0.22);
    setTimeout(() => this.noise(0.2, 3200, 0.15), 30);
  },

  sfxStar() { [880,1108.73,1318.51].forEach((f,i)=>setTimeout(()=>this.tone(f,0.25,'sine',0.18,0.005),i*25)); },
  sfxChop() { this.tone(200+Math.random()*100, 0.06, 'square', 0.12); },
  sfxWhip() { this.tone(300+Math.random()*200, 0.08, 'triangle', 0.07); },
  sfxPuzzle() { [523.25,659.25,783.99,1046.5].forEach((f,i)=>setTimeout(()=>this.tone(f,0.25,'sine',0.18),i*90)); },
  sfxCelebrate() { [523.25,659.25,783.99,1046.5,1318.51].forEach((f,i)=>setTimeout(()=>this.tone(f,0.35,'triangle',0.13),i*70)); },
  sfxCakeStep() { this.tone(659.25,0.12,'sine',0.18); setTimeout(()=>this.tone(880,0.18,'sine',0.18),70); },
  sfxType() { this.tone(1000+Math.random()*200, 0.025, 'square', 0.025); },
  sfxCandleOut() {
    this.noise(0.7, 400, 0.25);
    setTimeout(()=>this.tone(120,0.2,'sine',0.18), 180);
  },
  sfxDoorbell() { this.tone(523.25,0.45,'sine',0.28); setTimeout(()=>this.tone(392,0.7,'sine',0.28), 180); },

  // BGM: Happy Birthday 八音盒
  melody: [
    {f:392,d:.3},{f:392,d:.2},{f:440,d:.5},{f:392,d:.5},{f:523.25,d:.5},{f:493.88,d:.9},
    {f:392,d:.3},{f:392,d:.2},{f:440,d:.5},{f:392,d:.5},{f:587.33,d:.5},{f:523.25,d:.9},
    {f:392,d:.3},{f:392,d:.2},{f:783.99,d:.5},{f:659.25,d:.5},{f:523.25,d:.5},{f:493.88,d:.5},{f:440,d:.9},
    {f:698.46,d:.3},{f:698.46,d:.2},{f:659.25,d:.5},{f:523.25,d:.5},{f:587.33,d:.5},{f:523.25,d:.9},
  ],

  playBgmNote() {
    if (!this.ctx || !this.bgmOn) return;
    const n = this.melody[this.bgmIdx % this.melody.length];
    const t = this.ctx.currentTime;
    const mk = (freq, gv) => {
      const o = this.ctx.createOscillator(), g = this.ctx.createGain();
      o.type = 'sine'; o.frequency.setValueAtTime(freq, t);
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(gv, t+0.008);
      g.gain.exponentialRampToValueAtTime(0.001, t+n.d);
      o.connect(g); g.connect(this.bgmGain);
      o.start(t); o.stop(t+n.d+0.05);
    };
    mk(n.f, 0.07); mk(n.f*2, 0.025); mk(n.f*3, 0.008);
    this.bgmIdx++;
    this.bgmTimer = setTimeout(() => this.playBgmNote(), n.d * 1000);
  },

  startBgm() { if (!this.ctx || this.bgmOn) return; this.bgmOn=true; this.bgmIdx=0; this.playBgmNote(); document.getElementById('music-btn').classList.add('on'); },
  stopBgm() { this.bgmOn=false; clearTimeout(this.bgmTimer); document.getElementById('music-btn').classList.remove('on'); },
  toggle() { this.bgmOn ? this.stopBgm() : this.startBgm(); }
};
const FX = {
  canvas: null, ctx: null, particles: [], lx: 0, ly: 0,
  init() {
    this.canvas = document.getElementById('fx-canvas');
    this.ctx = this.canvas.getContext('2d');
    this.resize();
    window.addEventListener('resize', () => this.resize());
    const dot = document.getElementById('cursor-dot');
    document.addEventListener('mousemove', e => {
      dot.style.left = e.clientX+'px'; dot.style.top = e.clientY+'px';
      const dx=e.clientX-this.lx, dy=e.clientY-this.ly;
      if (Math.sqrt(dx*dx+dy*dy)>3) {
        for(let i=0;i<2;i++) this.particles.push({x:e.clientX+(Math.random()-.5)*6,y:e.clientY+(Math.random()-.5)*6,vx:(Math.random()-.5)*.4,vy:Math.random()*.4+.15,life:1,sz:Math.random()*1.8+.8,hue:Math.random()>.5?45:50});
      }
      this.lx=e.clientX; this.ly=e.clientY;
    });
    document.addEventListener('mousedown',()=>dot.classList.add('click'));
    document.addEventListener('mouseup',()=>dot.classList.remove('click'));
    this.loop();
  },
  resize() { this.canvas.width=innerWidth; this.canvas.height=innerHeight; },
  loop() {
    this.ctx.clearRect(0,0,this.canvas.width,this.canvas.height);
    for(let i=this.particles.length-1;i>=0;i--){
      const p=this.particles[i]; p.x+=p.vx; p.y+=p.vy; p.life-=0.02; p.vy+=0.008;
      if(p.life<=0){this.particles.splice(i,1);continue;}
      this.ctx.beginPath(); this.ctx.arc(p.x,p.y,p.sz*p.life,0,Math.PI*2);
      this.ctx.fillStyle=`hsla(${p.hue},100%,70%,${p.life})`; this.ctx.fill();
    }
    requestAnimationFrame(()=>this.loop());
  }
};

/* ================================================================
   阶段切换
   ================================================================ */
const Stage = {
  go(id) {
    const cur = document.querySelector('.stage.active');
    const nxt = document.getElementById('s-'+id);
    if(!nxt||cur===nxt) return;
    const bk = document.getElementById('blackout');
    bk.classList.add('show');
    setTimeout(()=>{
      if(cur) cur.classList.remove('active');
      nxt.classList.add('active');
      setTimeout(()=>bk.classList.remove('show'), 80);
    }, 700);
  }
};

/* ================================================================
   阶段一：烟花
   ================================================================ */
const FW = {
  canvas:null, ctx:null, parts:[], clicks:0, grand:false,
  init() {
    this.canvas=document.getElementById('fw-canvas');
    this.ctx=this.canvas.getContext('2d');
    this.resize();
    window.addEventListener('resize',()=>this.resize());
    this.canvas.addEventListener('click', e=>{
      if(this.grand) return;
      this.clicks++;
      this.spawn(e.clientX,e.clientY,25+Math.random()*15,'sm');
      Audio.sfxFirework();
      if(this.clicks>=1) document.getElementById('fw-hint').style.opacity='0';
      document.getElementById('fw-counter').textContent=this.clicks+'/5';
      if(this.clicks>=5&&!this.grand){this.grand=true;document.getElementById('fw-counter').textContent='';setTimeout(()=>this.grandShow(),400);}
    });
    this.loop();
  },
  resize(){this.canvas.width=innerWidth;this.canvas.height=innerHeight;},
  spawn(x,y,n,type){
    const cols=type==='lg'?['#FFD700','#FF6B6B','#4ECDC4','#FFA500','#FF69B4','#00CED1']:['#FFD700','#FFA500','#FF6B6B'];
    const c=cols[Math.floor(Math.random()*cols.length)];
    for(let i=0;i<n;i++){
      const a=(Math.PI*2*i)/n+Math.random()*.3, sp=(type==='lg'?4:2.2)+Math.random()*2;
      this.parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:1,color:c,sz:Math.random()*2.5+.8,trail:[]});
    }
  },
  grandShow(){
    let c=0;
    const iv=setInterval(()=>{
      this.spawn(innerWidth*(.2+Math.random()*.6),innerHeight*(.2+Math.random()*.3),70+Math.random()*50,'lg');
      Audio.sfxFirework(); c++;
      if(c>=8){clearInterval(iv);setTimeout(()=>{
        document.getElementById('bday-text').classList.add('show');
        let gc=0;const gi=setInterval(()=>{this.spawn(innerWidth*Math.random(),innerHeight*(.15+Math.random()*.35),50+Math.random()*40,'lg');Audio.sfxFirework();gc++;if(gc>=5)clearInterval(gi);},350);
        setTimeout(()=>Stage.go('puzzle'),3000);
        setTimeout(()=>Puzzle.init(),1200);
      },700);}
    },300);
  },
  loop(){
    this.ctx.fillStyle='rgba(0,0,0,0.15)';this.ctx.fillRect(0,0,this.canvas.width,this.canvas.height);
    for(let i=this.parts.length-1;i>=0;i--){
      const p=this.parts[i];p.trail.push({x:p.x,y:p.y});if(p.trail.length>4)p.trail.shift();
      p.x+=p.vx;p.y+=p.vy;p.vy+=0.04;p.vx*=0.99;p.vy*=0.99;p.life-=0.013;
      if(p.life<=0){this.parts.splice(i,1);continue;}
      for(let j=0;j<p.trail.length;j++){const t=p.trail[j];this.ctx.beginPath();this.ctx.arc(t.x,t.y,p.sz*(j/p.trail.length),0,Math.PI*2);this.ctx.fillStyle=this.rgba(p.color,(j/p.trail.length)*p.life*.4);this.ctx.fill();}
      this.ctx.beginPath();this.ctx.arc(p.x,p.y,p.sz*p.life,0,Math.PI*2);this.ctx.fillStyle=this.rgba(p.color,p.life);this.ctx.shadowBlur=12;this.ctx.shadowColor=p.color;this.ctx.fill();this.ctx.shadowBlur=0;
    }
    requestAnimationFrame(()=>this.loop());
  },
  rgba(hex,a){const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);return`rgba(${r},${g},${b},${a})`;}
};

/* ================================================================
   阶段二：拼图
   ================================================================ */
const Puzzle = {
  grid:[], sz:3, done:false, inited:false, selected:-1,
  init(){
    if(this.inited)return; this.inited=true;
    this.grid=[1,2,3,4,5,6,7,8,9];
    this.shuffle();
    this.render();
  },
  shuffle(){
    // Fisher-Yates 随机打乱
    do{
      for(let i=this.grid.length-1;i>0;i--){
        const j=Math.floor(Math.random()*(i+1));
        [this.grid[i],this.grid[j]]=[this.grid[j],this.grid[i]];
      }
    }while(this.solved());
  },
 render(){
    const el = document.getElementById('pz-grid'); 
    el.innerHTML = '';
    const imgSrc = '67a521dd-289d-4148-9640-d4c2566af931.jpg';
    
    // 循环生成 9 个拼图格子
    for(let i = 0; i < 9; i++){
      const cell = document.createElement('div');
      cell.className = 'pz-cell movable';
      cell.dataset.i = i;
      
      const v = this.grid[i]; // 这里的 v 是 1 到 9 之间的数字
      const img = document.createElement('img');
      img.src = imgSrc; 
      img.alt = v;
      
      // 精确计算每张图片切片的位置
      const cr = Math.floor((v - 1) / 3);
      const cc = (v - 1) % 3;
      img.style.left = (-cc * 100) + '%';
      img.style.top = (-cr * 100) + '%';
      
      cell.appendChild(img);
      
      // 如果被选中了，加上高亮样式
      if(i === this.selected) {
        cell.classList.add('selected');
      }
      
      // 点击格子时触发移动/交换
      cell.onclick = () => this.move(i);
      el.appendChild(cell);
    }
  },

       move(i){
    if(this.done)return;

    // 第一次点击：选中
    if(this.selected===-1){
      this.selected=i;
      Audio.tone(500,0.04,'sine',0.08);
      this.render();
      return;
    }
    // 点到同一块：取消选中
    if(this.selected===i){
      this.selected=-1;
      this.render();
      return;
    }
    // 交换两块
    [this.grid[this.selected],this.grid[i]]=[this.grid[i],this.grid[this.selected]];
    Audio.tone(600,0.06,'sine',0.1);
    this.selected=-1;
    this.render();
    if(this.solved())this.onDone();
  },
  solved(){for(let i=0;i<9;i++)if(this.grid[i]!==i+1)return false;return true;},
  onDone(){
    this.done=true;
    document.querySelectorAll('.pz-cell').forEach(c=>{c.classList.add('solved');c.style.pointerEvents='none';});
    Audio.sfxPuzzle();
    setTimeout(()=>document.getElementById('pz-bubble').classList.add('show'),400);
    setTimeout(()=>this.sequence(),2200);
  },
  sequence(){

const Stars = {
  canvas:null,ctx:null,bgStars:[],collected:0,total:25,inited:false,msgDone:false,
  init(){
    if(this.inited)return;this.inited=true;
    this.canvas=document.getElementById('stars-canvas');this.ctx=this.canvas.getContext('2d');
    this.resize();window.addEventListener('resize',()=>this.resize());
    for(let i=0;i<180;i++)this.bgStars.push({x:Math.random()*this.canvas.width,y:Math.random()*this.canvas.height,sz:Math.random()*1.4+.3,sp:Math.random()*.02+.005,ph:Math.random()*Math.PI*2,ba:Math.random()*.4+.2});
    this.scatter();this.loop();
  },
  resize(){this.canvas.width=innerWidth;this.canvas.height=innerHeight;},
  scatter(){
    const stage=document.getElementById('s-stars'),placed=[];
    for(let i=0;i<this.total;i++){
      const s=document.createElement('div');s.className='cstar twinkle';s.dataset.i=i;
      let x,y,att=0;
      do{x=70+Math.random()*(innerWidth-140);y=110+Math.random()*(innerHeight-180);att++;}while(att<40&&placed.some(p=>Math.abs(p.x-x)<45&&Math.abs(p.y-y)<45));
      placed.push({x,y});s.style.left=x+'px';s.style.top=y+'px';s.style.animationDelay=Math.random()*2+'s';
      s.onclick=()=>this.collect(s,x,y);
      stage.appendChild(s);
    }
  },
  collect(el,x,y){
    if(el.classList.contains('flying'))return;
    el.classList.add('flying');el.classList.remove('twinkle');
    const bar=document.querySelector('.star-bar-wrap').getBoundingClientRect();
    el.style.left=(bar.left+bar.width/2)+'px';el.style.top=(bar.top+bar.height/2)+'px';
    el.style.transform='scale(0.15)';el.style.opacity='0';
    Audio.sfxStar();
    setTimeout(()=>el.remove(),700);
    this.collected++;
    document.getElementById('sb-fill').style.width=(this.collected/this.total*100)+'%';
    document.getElementById('sb-text').textContent=this.collected+' / '+this.total;
    if(this.collected>=this.total&&!this.msgDone){this.msgDone=true;setTimeout(()=>this.showMsgs(),800);}
  },
  showMsgs(){
    document.getElementById('s-stars').classList.add('bright');
    const pw=document.querySelector('.star-bar-wrap');pw.style.transition='opacity 1s';pw.style.opacity='0';
    const box=document.getElementById('msg-box');box.style.display='block';
    setTimeout(()=>document.getElementById('ml1').classList.add('show'),400);
    setTimeout(()=>document.getElementById('ml2').classList.add('show'),2800);
    setTimeout(()=>document.getElementById('ml3').classList.add('show'),5200);
    setTimeout(()=>document.getElementById('ml4').classList.add('show'),8000);
    setTimeout(()=>document.getElementById('next-btn').classList.add('show'),10500);
    document.getElementById('next-btn').onclick=()=>{Stage.go('cake');setTimeout(()=>Cake.init(),1000);};
  },
  loop(){
    this.ctx.clearRect(0,0,this.canvas.width,this.canvas.height);
    for(const s of this.bgStars){s.ph+=s.sp;const a=s.ba+Math.sin(s.ph)*.25;this.ctx.beginPath();this.ctx.arc(s.x,s.y,s.sz,0,Math.PI*2);this.ctx.fillStyle=`rgba(255,255,255,${Math.max(0,a)})`;this.ctx.fill();}
    requestAnimationFrame(()=>this.loop());
  }
};

    const setupDrag = (mango, isCorrect) => {
      let isDragging = false;
      let startX = 0, startY = 0;

      // 初始化内联定位，防止 offsetLeft/Top 获取异常
      if (!mango.style.left) {
        mango.style.left = mango.offsetLeft + 'px';
        mango.style.top = mango.offsetTop + 'px';
      }

      let origLeft = parseFloat(mango.style.left);
      let origTop = parseFloat(mango.style.top);

      mango.onpointerdown = (e) => {
        isDragging = true;
        mango.setPointerCapture(e.pointerId);
        startX = e.clientX;

        origTop = parseFloat(mango.style.top);

        if (!isDragging) return;

        if (!isDragging) return;
        isDragging = false;

        const mRect = mango.getBoundingClientRect();
        const bRect = basket.getBoundingClientRect();
        const mCX = mRect.left + mRect.width / 2;
        const mCY = mRect.top + mRect.height / 2;

        // 碰撞检测：判断芒果中心点是否落入篮子区域
        const inBasket = (mCX >= bRect.left && mCX <= bRect.right && mCY >= bRect.top && mCY <= bRect.bottom);

        if (inBasket) {
          if (isCorrect) {
            // --- 选对了（好芒果） ---
            if (typeof Audio !== 'undefined' && Audio.sfxPuzzle) Audio.sfxPuzzle();

            mango.style.left = `${basket.offsetLeft + (basket.offsetWidth - mango.offsetWidth) / 2}px`;
            mango.style.top = `${basket.offsetTop + (basket.offsetHeight - mango.offsetHeight) / 2}px`;

          mango.style.zIndex = '50';

   // 步骤 3：打发奶油

    document.getElementById('sd-2').classList.remove('active');

    const whisk = document.getElementById('whisk-tool');
    const creamImg = document.getElementById('cream-img');
    
    let isDragging = false;
    let whipCount = 0;
    let lastX = 0, lastY = 0;

    // 1. 鼠标按下蛋抽开始拖拽
    whisk.onmousedown = (e) => {
        isDragging = true;
        whisk.classList.add('dragging');

    // 2. 监听全局鼠标移动
    window.onmousemove = (e) => {
        if (!isDragging) return;
        updateWhiskPosition(e);

        // 检测蛋抽是否处于奶油碗区域内
        const rect = creamImg.getBoundingClientRect();
        const isInCream = (
            e.clientX >= rect.left &&
            e.clientX <= rect.right &&
            e.clientY >= rect.top &&
            e.clientY <= rect.bottom
        );

        if (isInCream) {
            // 计算移动距离，防止原地点击误触发
            const dist = Math.hypot(e.clientX - lastX, e.clientY - lastY);
            if (dist > 10) {
                whipCount++;
                lastX = e.clientX;
                lastY = e.clientY;

                // 打发微动反馈
                creamImg.style.transform = `translate(-50%, -50%) scale(${1 + (whipCount % 2) * 0.04})`;

                // 阶段 1 ➔ 2：半打发

                    creamImg.src = 'bandafa.png';

        setTimeout(() => {
            startFinalStage();
        }, 1200);
                    
                    // 解除拖拽事件
                    isDragging = false;
                    whisk.classList.remove('dragging');
                    whisk.style.left = '';
                    whisk.style.top = '';
                    window.onmousemove = null;
                    whisk.onmousedown = null;

                    const sd3 = document.getElementById('sd-3');
                    if (sd3) sd3.classList.add('done');

                    if (nextBtn) {
                        nextBtn.disabled = false;
                        nextBtn.textContent = '进入下一步：组装蛋糕';
                        nextBtn.onclick = () => this.toAssemblyStep();
                    }
                }
            }
        }
    };

    // 3. 松开鼠标蛋抽复位
    window.onmouseup = () => {
        if (isDragging && whipCount < 50) {
            isDragging = false;
            whisk.classList.remove('dragging');
            whisk.style.left = '';
            whisk.style.top = '';
        }
    };

    // 辅助函数：更新拖拽位置
    function updateWhiskPosition(e) {
        whisk.style.left = e.clientX + 'px';
        whisk.style.top = e.clientY + 'px';
    }

/* ================================================================
   货架挑选与切换交互函数
   ================================================================ */
function selectMango(type) {
    const inst = document.getElementById('cake-inst');
    if (type === 'green') {
        if (inst) inst.textContent = '❌ 这个芒果还是绿色的，太酸啦！重新挑一个吧~';
        triggerShake();
    } else if (type === 'rotten') {
        if (inst) inst.textContent = '❌ 这个芒果已经坏掉啦，不能用来做生日蛋糕哦！';

const Finale = {
    analyser: null,
    stream: null,
    blowFrames: 0,
    monitoring: false,
    inited: false,

    init() {
        if (this.inited) return;
        this.inited = true;
        
        const micSt = document.getElementById('mic-st');
        if (micSt) {
            micSt.onclick = () => {
                if (!this.monitoring) this.startMic();
            };
        }

        const flame = document.getElementById('fl1');
        if (flame) flame.onclick = () => this.blowOut();
    },

    async startMic() {
        const st = document.getElementById('mic-st');
        try {
            if (st) st.textContent = '正在请求麦克风权限...';
            this.stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            this.analyser = audioCtx.createAnalyser();
            this.analyser.fftSize = 256;
            audioCtx.createMediaStreamSource(this.stream).connect(this.analyser);
            this.monitoring = true;
            if (st) st.textContent = '麦克风已就绪 — 对着设备用力吹气吧！';
            this.monitor();
        } catch (e) {
            if (st) st.textContent = '麦克风不可用 — 直接点击蜡烛火焰即可吹灭';
        }
    },

    monitor() {
        if (!this.monitoring) return;
        const buf = new Uint8Array(this.analyser.frequencyBinCount);
        this.analyser.getByteFrequencyData(buf);
        let sum = 0;
        for (let i = 0; i < buf.length; i++) sum += buf[i];
        const avg = sum / buf.length;

        const fill = document.getElementById('mic-fill');
        if (fill) fill.style.width = Math.min(100, (avg / 50) * 100) + '%';

        if (avg > 35) {
            this.blowFrames++;
            if (this.blowFrames > 5) {
                this.blowOut();
                return;
            }
        } else {
            this.blowFrames = Math.max(0, this.blowFrames - 1);
        }
        requestAnimationFrame(() => this.monitor());
    },

    blowOut() {
        this.monitoring = false;
        if (this.stream) {
            this.stream.getTracks().forEach(t => t.stop());
        }

        const flame = document.getElementById('fl1');
        if (flame) flame.style.display = 'none';
        
        const hint = document.getElementById('f-hint');
        if (hint) hint.textContent = '🎂 蜡烛已熄灭，生日愿望一定会实现！';

        setTimeout(() => {
            const msg = document.getElementById('f-msg');
            if (msg) msg.style.display = 'flex';
        }, 1200);
    }
};

// 1. Web Audio API 音效合成器
const CakeAudio = {
    ctx: null,
    init() {
        if (!this.ctx) {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            this.ctx = new AudioContext();
        }
        if (this.ctx.state === 'suspended') {
            this.ctx.resume();
        }
    },
    // 清脆的“叮”声
    playDing() {
        this.init();
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(1046.5, now);
        osc.frequency.exponentialRampToValueAtTime(2093, now + 0.08);

        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);

        osc.connect(gain);
        gain.connect(this.ctx.destination);

        osc.start(now);
        osc.stop(now + 0.35);
    },
    // 组装完成轻快提示音
    playSuccessFanfare() {
        this.init();
        const notes = [523.25, 659.25, 783.99, 1046.50];
        notes.forEach((freq, idx) => {
            const now = this.ctx.currentTime + idx * 0.12;
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();

            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, now);

            gain.gain.setValueAtTime(0.25, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);

            osc.connect(gain);
            gain.connect(this.ctx.destination);

            osc.start(now);
            osc.stop(now + 0.3);
        });
    }
};

// 2. Web Audio API 音效合成（纯 JS）
let audioCtx = null;
function getAudioContext() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') {
        audioCtx.resume();
    }
    return audioCtx;
}

function playLightSound() {
    const ctx = getAudioContext();
    const bufferSize = ctx.sampleRate * 0.2;
    const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
    const noise = ctx.createBufferSource();
    noise.buffer = buffer;
    const filter = ctx.createBiquadFilter();
    filter.type = 'highpass';
    filter.frequency.value = 1200;
    const gain = ctx.createGain();
    const now = ctx.currentTime;
    gain.gain.setValueAtTime(0.01, now);
    gain.gain.exponentialRampToValueAtTime(0.7, now + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
    noise.connect(filter);
    filter.connect(gain);
    gain.connect(ctx.destination);
    noise.start(now);
    noise.stop(now + 0.2);
}

function playBlowSound() {
    const ctx = getAudioContext();
    const bufferSize = ctx.sampleRate * 0.45;
    const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
    const noise = ctx.createBufferSource();
    noise.buffer = buffer;
    const filter = ctx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.setValueAtTime(250, ctx.currentTime);
    filter.frequency.exponentialRampToValueAtTime(750, ctx.currentTime + 0.15);
    filter.frequency.exponentialRampToValueAtTime(150, ctx.currentTime + 0.45);
    const gain = ctx.createGain();
    const now = ctx.currentTime;
    gain.gain.setValueAtTime(0.01, now);
    gain.gain.linearRampToValueAtTime(0.65, now + 0.08);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.45);
    noise.connect(filter);
    filter.connect(gain);
    gain.connect(ctx.destination);
    noise.start(now);
    noise.stop(now + 0.45);
}

function playDingSound() {
    const ctx = getAudioContext();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(1046.5, ctx.currentTime);
    const now = ctx.currentTime;
    gain.gain.setValueAtTime(0.4, now);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + 2.0);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(now);
    osc.stop(now + 2.0);
}

// 3. 巧思彩蛋：满屏金色彩带粒子雨特效
function launchConfetti() {
    const canvas = document.createElement('canvas');
    canvas.style.cssText = 'position:fixed;top:0;left:0;width:100vw;height:100vh;pointer-events:none;z-index:99999;';
    document.body.appendChild(canvas);
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const particles = Array.from({ length: 90 }).map(() => ({
        x: Math.random() * canvas.width,
        y: -10 - Math.random() * 20,
        size: Math.random() * 7 + 4,
        color: ['#ffeaa7', '#fdcb6e', '#ff7675', '#74b9ff', '#e84393', '#fd79a8'][Math.floor(Math.random() * 6)],
        speedY: Math.random() * 2.5 + 1.5,
        speedX: Math.random() * 1.5 - 0.75,
        rotation: Math.random() * 360,
        rotSpeed: Math.random() * 4 - 2
    }));

    function render() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        particles.forEach(p => {
            p.y += p.speedY;
            p.x += p.speedX;
            p.rotation += p.rotSpeed;
            ctx.save();
            ctx.translate(p.x, p.y);
            ctx.rotate((p.rotation * Math.PI) / 180);
            ctx.fillStyle = p.color;
            ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
            ctx.restore();
        });
        if (particles.some(p => p.y < canvas.height)) requestAnimationFrame(render);
        else canvas.remove();
    }
    render();
}

// 4. 初始化并展示第五部分界面
function initCandleStage() {
    if (document.getElementById('stage-candle')) return;

    injectCandleStyles();

    const stage = document.createElement('div');
    stage.id = 'stage-candle';
    stage.className = 'candle-stage';

    stage.innerHTML = [
        '\x3Cdiv id="dark-overlay" class="dark-overlay"\x3E\x3C/div\x3E',
        '\x3Cdiv id="cake-wrapper" class="cake-wrapper"\x3E',
        '    \x3Cimg src="chalazhudangao.png" alt="生日蛋糕" class="cake-img"\x3E',
        '    \x3Cdiv class="flame-container flame-left"\x3E',
        '        \x3Cdiv class="flame-glow"\x3E\x3C/div\x3E',
        '        \x3Cimg src="huomiao.png" alt="火苗" class="flame-img"\x3E',
        '    \x3C/div\x3E',
        '    \x3Cdiv class="flame-container flame-right"\x3E',
        '        \x3Cdiv class="flame-glow"\x3E\x3C/div\x3E',
        '        \x3Cimg src="huomiao.png" alt="火苗" class="flame-img"\x3E',
        '    \x3C/div\x3E',
        '\x3C/div\x3E',
        '\x3Cdiv id="wish-text" class="wish-text"\x3E愿望已经收好啦～\x3C/div\x3E',
        '\x3Cdiv id="ending-container" class="ending-container"\x3E',
        '    \x3Cdiv class="ending-lines"\x3E',
        '        \x3Cp class="ending-line"\x3E虽然今年生日不能陪着你，\x3C/p\x3E',
        '        \x3Cp class="ending-line"\x3E但是祝福是真的，\x3C/p\x3E',
        '        \x3Cp class="ending-line"\x3E蛋糕也是真的，\x3C/p\x3E',
        '        \x3Cp class="ending-line"\x3E现在去门口拿蛋糕吧～\x3C/p\x3E',
        '    \x3C/div\x3E',
        '    \x3Cdiv id="signature" class="signature"\x3E—— 邱鸿珂\x3C/div\x3E',
        '\x3C/div\x3E',
        '\x3Cbutton id="candle-btn" class="candle-btn"\x3E点蜡烛 🕯️\x3C/button\x3E'
    ].join('\n');

    document.body.appendChild(stage);

    let currentStage = 'light';
    const candleBtn = document.getElementById('candle-btn');
    const flames = document.querySelectorAll('.flame-container');
    const darkOverlay = document.getElementById('dark-overlay');
    const wishText = document.getElementById('wish-text');
    const cakeWrapper = document.getElementById('cake-wrapper');
    const endingLines = document.querySelectorAll('.ending-line');
    const signature = document.getElementById('signature');

    candleBtn.addEventListener('click', () => {
        getAudioContext();

        if (currentStage === 'light') {
            playLightSound();
            flames.forEach(flame => flame.classList.add('lit'));
            candleBtn.textContent = '吹蜡烛 🌬️';
            currentStage = 'blow';
        } else if (currentStage === 'blow') {
            playBlowSound();
            flames.forEach(flame => {
                flame.classList.remove('lit');
                flame.classList.add('extinguish');
            });
            candleBtn.style.opacity = '0';
            candleBtn.style.pointerEvents = 'none';

            setTimeout(() => { darkOverlay.style.opacity = '0.7'; }, 300);
            setTimeout(() => { wishText.style.opacity = '1'; }, 1200);

            setTimeout(() => {
                wishText.style.opacity = '0';
                darkOverlay.style.opacity = '0.94';
                cakeWrapper.style.opacity = '0';

                setTimeout(() => {
                    cakeWrapper.style.display = 'none';
                    endingLines.forEach((line, index) => {
                        setTimeout(() => { line.style.opacity = '1'; }, index * 1000);
                    });

                    const totalTextTime = endingLines.length * 1000;
                    setTimeout(() => {
                        signature.style.opacity = '1';
                        playDingSound();
                        launchConfetti(); // 触发满屏金色彩带雨！
                    }, totalTextTime + 500);
                }, 1200);
            }, 3200);
        }
    });
}
